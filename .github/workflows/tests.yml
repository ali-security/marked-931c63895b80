name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional space separated list of jasmine name patterns to scope the test run'
        required: false
        default: ''

jobs:
  Test:
    strategy:
      fail-fast: false
      matrix:
        node_version: [14, 16]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node_version }}
      - name: Pin registry to release date
        run: |
          npm config set registry https://time-machines-npm.sealsecurity.io/
          npm config set //time-machines-npm.sealsecurity.io/:_authToken=2021-05-27T16:17:12.429000Z
      - name: Install Dependencies
        run: npm ci
      - name: Minify 🗜️
        # marked.min.js is generated from lib/marked.js by uglify-js (npm run
        # minify). Regenerate it so the tested and packed bundle is always built
        # from the patched sources rather than trusted to be edited in lockstep.
        run: npm run minify
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          # jasmine --filter takes a single pattern, so a space separated
          # selector list is joined into one alternation.
          filter=$(printf '%s' "${{ inputs.test-filter }}" | tr -s ' ' '|' | sed 's/^|//; s/|$//')
          if [ -n "$filter" ]; then
            npm run test:unit -- --filter="$filter"
          else
            npm run test:unit
          fi
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          filter=$(printf '%s' "${{ inputs.test-filter }}" | tr -s ' ' '|' | sed 's/^|//; s/|$//')
          if [ -n "$filter" ]; then
            npm run test:specs -- --filter="$filter"
          else
            npm run test:specs
          fi
      - name: Pack 📦
        if: matrix.node_version == 14
        run: |
          npm i -g npm@7.12.0
          npm pack
      - name: Upload package tarball
        if: matrix.node_version == 14
        uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: marked-*.tgz
          if-no-files-found: error
